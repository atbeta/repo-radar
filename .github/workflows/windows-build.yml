name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run core tests
        working-directory: core
        run: cargo test

      - name: Build NSIS installer
        run: npm run tauri build

      - name: List release dir (debug)
        shell: pwsh
        run: Get-ChildItem target/release -Filter *.exe | Format-Table Name,Length

      - name: Upload raw exe
        uses: actions/upload-artifact@v4
        with:
          name: raw-exe
          path: target/release/*.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoRadar-windows-installer-${{ github.ref_name }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

  package:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download raw exe
        uses: actions/download-artifact@v4
        with:
          name: raw-exe

      - name: Package portable zip
        shell: pwsh
        run: |
          Get-ChildItem . -Filter *.exe | Format-Table Name,Length
          $exe = Get-ChildItem . -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no exe in artifact"; exit 1 }
          Copy-Item $exe.FullName RepoRadar.exe -Force
          $tag = "${{ github.ref_name }}" -replace '^v',''
          Compress-Archive -Path RepoRadar.exe -DestinationPath "RepoRadar-$tag-portable-windows.zip" -Force
          Get-ChildItem *.zip | Format-Table Name,Length

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoRadar-windows-portable-${{ github.ref_name }}
          path: RepoRadar-*-portable-windows.zip
          retention-days: 14
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh release create "$TAG" --title "$TAG" --notes "RepoRadar $TAG" 2>/dev/null || true
          gh release upload "$TAG" \
            RepoRadar-*-portable-windows.zip --clobber
