name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run core tests
        working-directory: core
        run: cargo test

      - name: Build NSIS installer
        # tauri.conf.json bundle.targets = ["nsis"]；裸壳 exe 在 target/release/repo-radar.exe
        run: npm run tauri build

      - name: Build portable zip (exe only)
        # repo-radar 无内嵌 engine，裸 exe 即完整应用（设置与状态在 %APPDATA%）
        # exe 名不硬编码：tauri 2 可能用 cargo 包名（repo-radar.exe）或 productName（"Repo Radar.exe"）
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src-tauri/target/release"
          TAG="${{ github.ref_name }}"
          ZIP_NAME="RepoRadar-${TAG#v}-portable-windows.zip"
          EXE=$(ls *.exe | head -1)
          echo "bundling exe: $EXE"
          test -n "$EXE"
          cp "$EXE" RepoRadar.exe
          7z a -tzip "$ZIP_NAME" RepoRadar.exe
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoRadar-windows-installer-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoRadar-windows-portable-${{ github.ref_name }}
          path: RepoRadar-*-portable-windows.zip
          retention-days: 14
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh release create "$TAG" --title "$TAG" --notes "RepoRadar $TAG" 2>/dev/null || true
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/nsis/*.exe \
            RepoRadar-*-portable-windows.zip --clobber
